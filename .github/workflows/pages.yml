name: Build static export

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://treelist.ai
      - name: Confirm static files
        run: |
          test -f out/CNAME
          test -f out/.nojekyll
          test -d out/pittsburgh-pa
          test -d out/dayton-oh
          test -d out/omaha-ne
          test -f out/b0012ad74f75e5722d8c062d9b80bdd26f8af6c6bf5c6d37b6822dac893efef8.txt
          test "$(cat out/b0012ad74f75e5722d8c062d9b80bdd26f8af6c6bf5c6d37b6822dac893efef8.txt)" = "b0012ad74f75e5722d8c062d9b80bdd26f8af6c6bf5c6d37b6822dac893efef8"
      - name: Ping IndexNow with sitemap URLs
        run: node scripts/ping-indexnow.mjs
