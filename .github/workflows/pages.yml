name: Build static export

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://treelist.ai
      - name: Confirm static files
        run: |
          test -f out/CNAME
          test -f out/.nojekyll
          test -d out/pittsburgh-pa
          test -d out/dayton-oh
